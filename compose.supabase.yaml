# Separate hosted staging stack. Keeps the local database and app untouched.
name: udhaar-supabase

x-hosted-environment: &hosted-environment
  UDHAAR_ENV: staging
  UDHAAR_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in .env using the Session pooler and sslmode=require}
  UDHAAR_DATABASE_SCHEMA: udhaar
  UDHAAR_AUTH_PROVIDER: supabase
  UDHAAR_COOKIE_SECURE: ${UDHAAR_HOSTED_COOKIE_SECURE:-false}
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  UDHAAR_EMAIL_FROM: ${UDHAAR_EMAIL_FROM:-}
  UDHAAR_PUBLIC_URL: ${UDHAAR_PUBLIC_URL:-}

services:
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      <<: *hosted-environment
      TEST_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in .env}
    # Isolated temporary schemas in the real hosted database; auth is simulated.
    command: ["python", "-m", "pytest", "-q", "tests/test_supabase_auth.py", "-k", "expired_access_refreshes_and_rotates_cookies or profile_is_stable_on_repeat_signin_and_accounts_are_isolated or anonymous_loan_link_still_supports_both_acknowledgments"]

  migrate:
    build:
      context: .
      target: runtime
    environment: *hosted-environment
    command: ["python", "-m", "backend.migrate", "upgrade"]

  app:
    build:
      context: .
      target: runtime
    environment: *hosted-environment
    ports:
      - "127.0.0.1:${SUPABASE_APP_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
